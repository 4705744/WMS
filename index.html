<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAYVERSE · 小游戏街机厅</title>
<style>
:root{--bg:#090e1d;--card:#151d35;--line:#2a3960;--ink:#edf4ff;--muted:#9aa9c4;--a:#75f7cf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#253b6b,transparent 32rem),radial-gradient(circle at 90% 18%,#57205d,transparent 28rem),var(--bg);color:var(--ink);font-family:Inter,"Microsoft YaHei",sans-serif;min-height:100vh}header{max-width:1120px;margin:auto;padding:58px 22px 35px;text-align:center}.badge{color:var(--a);font-size:12px;letter-spacing:.18em;font-weight:800}h1{font-size:clamp(38px,7vw,72px);letter-spacing:-.065em;margin:12px 0}.lead{color:var(--muted);margin:auto;max-width:540px;line-height:1.7}.arcade{max-width:1120px;padding:10px 22px 55px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.game-card{min-height:185px;padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#1a2644,#10172a);text-align:left;color:inherit;cursor:pointer;position:relative;overflow:hidden;transition:.22s;font:inherit}.game-card:hover{transform:translateY(-7px);border-color:var(--a);box-shadow:0 18px 35px #0007}.game-card:focus-visible{outline:3px solid #fff}.game-card::after{content:"开始游戏 →";position:absolute;right:16px;bottom:15px;font-size:12px;color:var(--a);font-weight:700}.icon{font-size:45px;display:block;margin:3px 0 19px;filter:drop-shadow(0 7px 7px #0007)}.game-card h2{font-size:18px;margin:0 0 6px}.game-card p{font-size:12px;color:var(--muted);margin:0;line-height:1.45}.game-card[data-game="tower"]{background:linear-gradient(145deg,#254a3a,#11251f)}.game-card[data-game="space"]{background:linear-gradient(145deg,#28225d,#111332)}.game-card[data-game="color"]{background:linear-gradient(145deg,#49284f,#201525)}.game-card[data-game="snake"]{background:linear-gradient(145deg,#304929,#152413)}footer{text-align:center;color:#6f7e9b;padding:20px}.modal{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:16px;background:#030713d9;backdrop-filter:blur(9px)}.modal.open{display:grid}.window{width:min(820px,100%);max-height:94vh;overflow:auto;border:1px solid #38517d;border-radius:24px;background:#10192d;box-shadow:0 30px 100px #000;position:relative;padding:25px}.close{position:absolute;right:17px;top:17px;border:0;background:#253553;color:#fff;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}.game-head{padding-right:38px}.game-head h2{margin:0;font-size:28px}.game-head p{margin:6px 0 18px;color:var(--muted);font-size:13px}.stage{width:100%;height:min(56vh,440px);display:block;border-radius:16px;background:#091322;touch-action:none}.tools{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-top:12px;color:#cddbf0;font-size:14px}.button{border:1px solid #47658e;background:#203453;color:#fff;border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.button:hover,.button.active{background:#28736e;border-color:var(--a)}.choices{display:flex;gap:7px;flex-wrap:wrap}.color-stage{background:#1a1a1a;padding:16px}.color-hud{display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px}.hearts{color:#ff6682}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;height:calc(100% - 44px)}.swatch{border:0;border-radius:12px;cursor:pointer;transition:.14s;box-shadow:0 7px 13px #0005}.swatch:hover{transform:translateY(-3px);box-shadow:0 12px 16px #0009}.bar{height:5px;background:#333;border-radius:5px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:#76f4cf;transition:width .1s}.reaction{height:min(56vh,440px);border-radius:16px;display:grid;place-items:center;background:#17233c;text-align:center;cursor:pointer;user-select:none}.reaction.wait{background:#4a3054}.reaction.go{background:#139877;box-shadow:inset 0 0 60px #aaffdb}.reaction strong{font-size:34px}.reaction p{color:#d0d9ed;font-size:14px}.merge{height:min(56vh,440px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;border-radius:16px;background:#091322}.tile{border:0;border-radius:12px;background:#233656;color:white;font-size:26px;font-weight:800;cursor:pointer}.tile:hover{filter:brightness(1.25)}.v4{background:#357568}.v8{background:#8b663a}.v16{background:#96536f}.v32{background:#ae4c48}.memory{height:min(56vh,440px);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;background:#0c1425;border-radius:16px}.memory button{border:0;border-radius:13px;background:#304364;color:transparent;font-size:30px;cursor:pointer}.memory button.open{background:#ebf4ff;color:#17223b}.aim{position:relative;height:min(56vh,440px);overflow:hidden;border-radius:16px;background:radial-gradient(circle,#173156,#07111f)}.target{position:absolute;width:54px;height:54px;border-radius:50%;border:10px solid #ffef86;background:#ff5f88;box-shadow:0 0 20px #ff5f88;cursor:crosshair}.snake{height:min(56vh,440px);display:grid;place-items:center;background:#071a12;border-radius:16px}.snake canvas{max-width:100%;max-height:100%;image-rendering:pixelated}@media(max-width:850px){.arcade{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){header{padding-top:38px}.arcade{grid-template-columns:1fr}.game-card{min-height:140px}.window{padding:18px}.stage,.reaction,.merge,.memory,.aim,.snake{height:55vh}}
</style></head>
<body>
<header><div class="badge">PLAYVERSE · ARCADE SELECT</div><h1>选择一个世界，<br>开始游戏。</h1><p class="lead">每一台街机都有专属图标和玩法。点击游戏框进入，按 Esc 随时回到选择大厅。</p></header>
<main class="arcade" id="arcade">
 <button class="game-card" data-game="tower"><span class="icon">🏰</span><h2>路径大师</h2><p>布塔守住蜿蜒防线</p></button><button class="game-card" data-game="color"><span class="icon">🎨</span><h2>色感试炼</h2><p>找出唯一不同的色块</p></button><button class="game-card" data-game="space"><span class="icon">🚀</span><h2>星尘收集者</h2><p>穿越星海，躲开陨石</p></button><button class="game-card" data-game="reaction"><span class="icon">⚡</span><h2>闪击反应</h2><p>挑战毫秒级反应</p></button><button class="game-card" data-game="merge"><span class="icon">🔢</span><h2>合成方块</h2><p>合并相邻的相同数字</p></button><button class="game-card" data-game="aim"><span class="icon">🎯</span><h2>靶心风暴</h2><p>30 秒内命中更多目标</p></button><button class="game-card" data-game="memory"><span class="icon">🧠</span><h2>记忆翻牌</h2><p>翻出全部配对图案</p></button><button class="game-card" data-game="snake"><span class="icon">🐍</span><h2>霓虹贪吃蛇</h2><p>收集能量，不要撞墙</p></button>
</main><footer>8 台可玩的迷你街机 · 无需登录，即点即玩</footer>
<div class="modal" id="modal"><div class="window"><button class="close" aria-label="关闭">×</button><div id="gameView"></div></div></div>
<script>
const $=s=>document.querySelector(s),view=$('#gameView'),modal=$('#modal');let stop=()=>{};
const head=(title,desc,body,tools='')=>`<div class="game-head"><h2>${title}</h2><p>${desc}</p></div>${body}${tools?`<div class="tools">${tools}</div>`:''}`;
function canvas(id){let c=$(id),x=c.getContext('2d'),r=()=>{let d=devicePixelRatio;c.width=c.clientWidth*d;c.height=c.clientHeight*d;x.setTransform(d,0,0,d,0,0);return[c.clientWidth,c.clientHeight]};return[c,x,r]}
function tower(){let selected=1,gold=80,hp=20,wave=1,t=[],es=[],shots=[],running=true;view.innerHTML=head('🏰 路径大师','点击草地放置炮塔。按 1 / 2 / 3 切换塔型，别让敌人冲过终点。','<canvas id="towerCanvas" class="stage"></canvas>','<span id="towerStat">💰 80　❤ 20　波次 1</span><div class="choices"><button class="button active" data-k="1">1 蓝塔 ¥25</button><button class="button" data-k="2">2 红塔 ¥35</button><button class="button" data-k="3">3 紫塔 ¥45</button><button class="button" id="wave">下一波</button></div>');let[c,x,rs]=canvas('#towerCanvas'),w,h;const path=()=>[[-8,60],[w*.22,60],[w*.31,h*.72],[w*.59,h*.72],[w*.7,h*.28],[w+8,h*.28]];function at(z){let p=path(),len=[],all=0;for(let i=1;i<p.length;i++){let l=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);len.push(l);all+=l}let d=z*all;for(let i=1;i<p.length;i++){if(d<=len[i-1]){let a=p[i-1],b=p[i],q=d/len[i-1];return{x:a[0]+(b[0]-a[0])*q,y:a[1]+(b[1]-a[1])*q}}return{x:w,y:h*.28}}function loop(){if(!running)return;[w,h]=rs();x.fillStyle='#155035';x.fillRect(0,0,w,h);let p=path();x.strokeStyle='#ccd4d2';x.lineWidth=27;x.lineJoin='round';x.beginPath();p.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.stroke();t.forEach(q=>{x.fillStyle=['','#4bb3ff','#ff6271','#c274ff'][q.k];x.fillRect(q.x-10,q.y-10,20,20);x.fillStyle='#e7f8ff';x.beginPath();x.arc(q.x,q.y,7,0,7);x.fill()});for(let q of es){q.z+=q.sp;let a=at(q.z);x.fillStyle=q.b?'#bd55fc':`hsl(${q.hp/q.max*110},80%,50%)`;x.beginPath();x.arc(a.x,a.y,q.b?10:7,0,7);x.fill();x.fillStyle='#172';x.fillRect(a.x-10,a.y-15,20,3);x.fillStyle='#8ff0a5';x.fillRect(a.x-10,a.y-15,20*q.hp/q.max,3)}t.forEach(q=>{q.cd=Math.max(0,q.cd-1);let e=es.find(e=>{let a=at(e.z);return Math.hypot(a.x-q.x,a.y-q.y)<(q.k==3?100:75)});if(e&&!q.cd){e.hp-=[0,14,7,10][q.k];q.cd=q.k==2?10:25}});let dead=es.filter(e=>e.hp<=0),out=es.filter(e=>e.z>=1);gold+=dead.reduce((a,e)=>a+(e.b?25:7),0);hp-=out.length;es=es.filter(e=>e.hp>0&&e.z<1);$('#towerStat').textContent=`💰 ${gold}　❤ ${hp}　波次 ${wave}`;requestAnimationFrame(loop)}c.onpointerdown=e=>{let r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,cost=[0,25,35,45][selected];if(gold>=cost&&!path().some(a=>Math.hypot(px-a[0],py-a[1])<32)){t.push({x:px,y:py,k:selected,cd:0});gold-=cost}};document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{selected=+b.dataset.k;document.querySelectorAll('[data-k]').forEach(a=>a.classList.toggle('active',a===b))});$('#wave').onclick=()=>{let n=6+wave*2,b=wave%5==0;for(let i=0;i<n;i++)setTimeout(()=>es.push({z:0,hp:(b?100:20)+wave*6,max:(b?100:20)+wave*6,sp:.00055+wave*.00004,b:b&&i==n-1}),i*300);wave++};let key=e=>{if('123'.includes(e.key))document.querySelector(`[data-k="${e.key}"]`).click()};addEventListener('keydown',key);loop();stop=()=>{running=false;removeEventListener('keydown',key)}}
}
function color(){let level=1,score=0,life=5,timer;view.innerHTML=head('🎨 色感试炼','在倒计时结束前找出那个颜色不同的方块。','<div class="color-stage stage"><div class="color-hud"><span>关卡 <b id="lv">1</b>　得分 <b id="cs">0</b></span><span class="hearts" id="life">♥♥♥♥♥</span></div><div class="colors" id="colors"></div></div><div class="bar"><i id="bar"></i></div>');function make(){clearInterval(timer);let n=level<4?4:level<8?5:6,base=Math.random()*360,odd=Math.floor(Math.random()*n*n),box=$('#colors');box.style.gridTemplateColumns=`repeat(${n},1fr)`;box.innerHTML='';for(let i=0;i<n*n;i++){let b=document.createElement('button'),yes=i==odd;b.className='swatch';b.style.background=`hsl(${base+(yes?Math.max(4,22-level*1.3):0)} 70% ${yes?52:48}%)`;b.onclick=()=>{if(yes){level++;score+=10}else life--;if(!life){level=1;score=0;life=5}make()};box.append(b)}let ms=Math.max(1800,5000-level*180),start=performance.now();timer=setInterval(()=>{let p=1-(performance.now()-start)/ms;$('#bar').style.width=Math.max(0,p*100)+'%';if(p<=0){life--;if(!life){level=1;score=0;life=5}make()}},70);$('#lv').textContent=level;$('#cs').textContent=score;$('#life').textContent='♥'.repeat(life)+'♡'.repeat(5-life)}make();stop=()=>clearInterval(timer)}
function space(){view.innerHTML=head('🚀 星尘收集者','拖动飞船收集蓝色星尘，躲开红色陨石。方向键 / WASD 同样可用。','<canvas id="spaceCanvas" class="stage"></canvas>','<span id="spaceStat">得分 0　×1　🚀🚀🚀</span><button class="button" id="spaceReset">重新起飞</button>');let[c,x,rs]=canvas('#spaceCanvas'),ship={x:200,y:220},o=[],keys={},score=0,combo=1,lives=3,go=true,w,h;function loop(){if(!go)return;[w,h]=rs();x.fillStyle='#080d27';x.fillRect(0,0,w,h);for(let i=0;i<45;i++){x.fillStyle='#c7e7ff';x.fillRect((i*67)%w,(i*43+performance.now()/25)%h,1,1)}if(keys.ArrowLeft||keys.a)ship.x-=4;if(keys.ArrowRight||keys.d)ship.x+=4;if(keys.ArrowUp||keys.w)ship.y-=4;if(keys.ArrowDown||keys.s)ship.y+=4;ship.x=Math.max(12,Math.min(w-12,ship.x));ship.y=Math.max(12,Math.min(h-12,ship.y));if(Math.random()<.045)o.push({x:Math.random()*w,y:-12,k:Math.random()<.72?'d':'r'});o.forEach(a=>{a.y+=a.k=='r'?2.7:1.7;x.fillStyle=a.k=='r'?'#f25d69':'#5eeaff';x.shadowBlur=13;x.shadowColor=x.fillStyle;x.beginPath();x.arc(a.x,a.y,a.k=='r'?11:7,0,7);x.fill();if(Math.hypot(a.x-ship.x,a.y-ship.y)<18){if(a.k=='d'){score+=combo;combo=Math.min(10,combo+1)}else{lives--;combo=1}a.y=h+30}});x.shadowBlur=0;o=o.filter(a=>a.y<h+20);x.fillStyle='white';x.beginPath();x.moveTo(ship.x,ship.y-14);x.lineTo(ship.x-11,ship.y+12);x.lineTo(ship.x+11,ship.y+12);x.fill();$('#spaceStat').textContent=`得分 ${score}　×${combo}　${'🚀'.repeat(Math.max(0,lives))}`;if(lives>0)requestAnimationFrame(loop);else{x.fillStyle='white';x.fillText('GAME OVER',w/2-35,h/2)}}c.onpointermove=e=>{let r=c.getBoundingClientRect();ship.x=e.clientX-r.left;ship.y=e.clientY-r.top};let kd=e=>keys[e.key]=true,ku=e=>keys[e.key]=false;addEventListener('keydown',kd);addEventListener('keyup',ku);$('#spaceReset').onclick=()=>{score=0;combo=1;lives=3;o=[];go=false;go=true;loop()};loop();stop=()=>{go=false;removeEventListener('keydown',kd);removeEventListener('keyup',ku)}}
function reaction(){let state='idle',timeout,startedAt=0,best=localStorage.reactBest||0;view.innerHTML=head('⚡ 闪击反应','等待区域变绿后立即点击。过早点击算抢跑。','<div class="reaction" id="react"><div><strong id="rt">点击开始</strong><p id="ri">准备好挑战反应速度了吗？</p></div></div>','<span id="rb">最佳：'+(best?best+' ms':'--')+'</span><button class="button" id="startR">开始挑战</button>');let start=()=>{clearTimeout(timeout);state='wait';$('#react').className='reaction wait';$('#rt').textContent='等待信号…';$('#ri').textContent='不要抢跑';timeout=setTimeout(()=>{state='go';startedAt=performance.now();$('#react').className='reaction go';$('#rt').textContent='现在点击！'},1500+Math.random()*2500)};$('#startR').onclick=start;$('#react').onclick=()=>{if(state==='idle')return start();if(state==='wait'){$('#rt').textContent='抢跑了！';state='idle';clearTimeout(timeout)}else{let n=Math.round(performance.now()-startedAt);if(!best||n<best){best=n;localStorage.reactBest=best}$('#rt').textContent=n+' ms';$('#ri').textContent='点击再来一次';$('#rb').textContent='最佳：'+best+' ms';state='idle'}};stop=()=>clearTimeout(timeout)}
function merge(){let b,score=0,sel=null;view.innerHTML=head('🔢 合成方块','先点一个数字，再点相邻的相同数字进行合成。','<div class="merge" id="merge"></div>','<span id="mergeStat">分数 0</span><button class="button" id="newMerge">新局</button>');function render(){let m=$('#merge');m.innerHTML='';b.forEach((n,i)=>{let q=document.createElement('button');q.className='tile v'+Math.min(32,n);q.textContent=n;q.onclick=()=>{if(sel===null){sel=i;q.style.outline='3px solid #75f7cf';return}let d=Math.abs(sel-i),row=(sel/4|0)===(i/4|0);if(b[sel]===n&&(d==4||(d==1&&row))){b[i]*=2;b[sel]=2;score+=b[i]}sel=null;render()};m.append(q)});$('#mergeStat').textContent='分数 '+score}function reset(){score=0;sel=null;b=Array.from({length:16},()=>Math.random()<.75?2:4);render()}$('#newMerge').onclick=reset;reset()}
function aim(){let score=0,left=30,interval;view.innerHTML=head('🎯 靶心风暴','30 秒内点击不断出现的靶心，挑战你的命中数。','<div class="aim" id="aim"></div>','<span id="aimStat">命中 0　剩余 30 秒</span><button class="button" id="aimStart">开始</button>');let field=$('#aim');function spawn(){let q=document.createElement('button');q.className='target';q.style.left=Math.random()*(field.clientWidth-54)+'px';q.style.top=Math.random()*(field.clientHeight-54)+'px';q.onclick=()=>{score++;q.remove();spawn()};field.append(q)}$('#aimStart').onclick=()=>{clearInterval(interval);score=0;left=30;field.innerHTML='';spawn();interval=setInterval(()=>{left--;$('#aimStat').textContent=`命中 ${score}　剩余 ${left} 秒`;if(!left){clearInterval(interval);field.innerHTML='<p style="text-align:center;padding-top:35%;font-size:25px">最终命中：'+score+'</p>'}},1000)};stop=()=>clearInterval(interval)}
function memory(){let icons=['🍉','🍉','🌙','🌙','⭐','⭐','🎈','🎈','🍀','🍀','🍩','🍩','🐙','🐙','🎲','🎲'],first=null,lock=false,moves=0;view.innerHTML=head('🧠 记忆翻牌','翻开两张相同图案即可配对，看看你需要几步。','<div class="memory" id="memory"></div>','<span id="memStat">步数 0</span><button class="button" id="memReset">重排</button>');function reset(){first=null;lock=false;moves=0;let a=icons.slice().sort(()=>Math.random()-.5),box=$('#memory');box.innerHTML='';a.forEach(v=>{let q=document.createElement('button');q.dataset.v=v;q.onclick=()=>{if(lock||q.classList.contains('open'))return;q.textContent=v;q.classList.add('open');if(!first){first=q;return}moves++;$('#memStat').textContent='步数 '+moves;if(first.dataset.v===q.dataset.v){first=null;if([...box.children].every(x=>x.classList.contains('open')))$('#memStat').textContent='完成！共 '+moves+' 步'}else{lock=true;let a=first;setTimeout(()=>{a.textContent=q.textContent='';a.classList.remove('open');q.classList.remove('open');first=null;lock=false},650)}};box.append(q)})}$('#memReset').onclick=reset;reset()}
function snake(){view.innerHTML=head('🐍 霓虹贪吃蛇','按“开始游戏”后使用方向键或 WASD 移动。收集粉色能量，别撞到边界或自己。','<div class="snake"><canvas id="snakeC" width="480" height="360"></canvas></div>','<span id="snakeStat">准备开始</span><button class="button" id="snakeStart">开始游戏</button><button class="button" id="snakeReset">重新开始</button>');let c=$('#snakeC'),x=c.getContext('2d'),snake,food,dir,tick,active=false;function placeFood(){do{food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*15)}}while(snake.some(a=>a.x===food.x&&a.y===food.y))}function reset(){clearInterval(tick);snake=[{x:10,y:8},{x:9,y:8},{x:8,y:8}];dir={x:1,y:0};active=false;placeFood();draw();$('#snakeStat').textContent='准备开始'}function start(){if(active)return;active=true;$('#snakeStat').textContent='得分 '+(snake.length-3);tick=setInterval(step,115)}function step(){let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eating=h.x===food.x&&h.y===food.y,body=eating?snake:snake.slice(0,-1);if(h.x<0||h.y<0||h.x>=20||h.y>=15||body.some(a=>a.x===h.x&&a.y===h.y)){clearInterval(tick);active=false;$('#snakeStat').textContent='游戏结束 · 得分 '+(snake.length-3);return}snake.unshift(h);if(eating)placeFood();else snake.pop();draw()}function draw(){x.fillStyle='#071b12';x.fillRect(0,0,480,360);x.fillStyle='#ff6ea8';x.fillRect(food.x*24+3,food.y*24+3,18,18);snake.forEach((a,i)=>{x.fillStyle=i?'#65f5b7':'#eafff7';x.fillRect(a.x*24+2,a.y*24+2,20,20)});if(active)$('#snakeStat').textContent='得分 '+(snake.length-3)}let kd=e=>{let m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m){e.preventDefault();if(m[0]!==-dir.x&&m[1]!==-dir.y)dir={x:m[0],y:m[1]};start()}};addEventListener('keydown',kd);$('#snakeStart').onclick=start;$('#snakeReset').onclick=reset;reset();stop=()=>{clearInterval(tick);removeEventListener('keydown',kd)}}
const games={tower,color,space,reaction,merge,aim,memory,snake};document.querySelectorAll('.game-card').forEach(b=>b.onclick=()=>{stop();modal.classList.add('open');games[b.dataset.game]()});function close(){stop();modal.classList.remove('open');view.innerHTML=''}$('.close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))close()});
</script></body></html>
